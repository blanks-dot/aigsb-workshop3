<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Art of Personalization: speaker notes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.svg"><link rel="stylesheet" href="/deck/deck.css">
<style>
#frame{right:34%}
.bar{right:calc(34% + 16px)}
#side{position:fixed;top:0;right:0;bottom:0;width:34%;background:#f3ede2;color:#141413;display:flex;flex-direction:column;padding:28px 30px;overflow:auto}
#notes-count{font:13px 'DM Mono',monospace;letter-spacing:1px;color:#c2471f;text-transform:uppercase;margin-bottom:14px}
#notes{font-size:19px;line-height:1.55}
#gate{position:fixed;inset:0;background:#141413;display:grid;place-items:center;z-index:10}
#gate form{background:#f3ede2;padding:32px;border-radius:20px;width:min(360px,90vw);display:flex;flex-direction:column;gap:12px}
#gate h1{margin:0;font:400 34px 'Instrument Serif',Georgia,serif}
#gate input{font:16px 'DM Sans',Arial;padding:12px 14px;border:1px solid #ddd3c3;border-radius:10px}
#gate button{font:600 16px 'DM Sans',Arial;padding:12px;border:0;border-radius:10px;background:#141413;color:#f3ede2;cursor:pointer}
#err{color:#c2471f;font-size:14px;min-height:18px;margin:0}
@media (max-width:800px){#frame{right:0;bottom:45%}.bar{right:16px;bottom:calc(45% + 10px)}#side{top:55%;width:100%}}
</style>
</head><body data-notes="1">
<div id="frame"><div id="stage"></div></div>
<div class="bar"><button id="prev" aria-label="Previous slide">←</button><span id="count"></span><button id="next" aria-label="Next slide">→</button></div>
<aside id="side"><div id="notes-count"></div><div id="notes"></div></aside>
<div id="gate"><form id="f"><h1>Speaker notes</h1><input id="k" type="password" placeholder="Password" autocomplete="current-password" autofocus><button>Open</button><p id="err"></p></form></div>
<script src="/deck/deck.js"></script>
<script>
async function unlock(key){
  const r = await fetch("/api/deck-notes", { headers: { "x-instructor-key": key } });
  if (!r.ok) return false;
  const d = await r.json(); sessionStorage.setItem("deckKey", key);
  document.getElementById("gate").remove(); await window.startDeck(d.notes); return true;
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault(); document.getElementById("err").textContent = "";
  if (!(await unlock(document.getElementById("k").value))) document.getElementById("err").textContent = "That password isn't right.";
});
try { const k = sessionStorage.getItem("deckKey"); if (k) unlock(k); } catch (e) {}
</script>
</body></html>
