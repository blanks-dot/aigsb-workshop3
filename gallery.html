<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Class gallery | AI@GSB Workshop 3</title>
<meta name="description" content="Every site that went live tonight.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="brand-text">The Art of <em>Personalization</em><span class="brand-note">class gallery</span></span>
  </div>
  <div class="spacer"></div>
  <a class="btn small ghost" href="index.html">← Back to the workshop</a>
</header>

<main class="gal" data-part="deploy">
  <header class="gal-head step-head">
    <div class="step-meta"><span class="step-num">✦</span><span class="part-chip">Host</span><span class="when-chip" id="room-chip" hidden></span></div>
    <h1>Everyone's site, <em>live</em></h1>
    <p class="gal-note">Added automatically when you paste your link in step 6. Untick the box there to remove yours</p>
  </header>

  <p class="gal-count" id="count" aria-live="polite"></p>
  <div class="gal-grid" id="grid"></div>
  <p class="gal-empty" id="empty" hidden>No links yet. The first one lands here within a few seconds of someone pasting it</p>
  <p class="form-err" id="err" hidden></p>
</main>

<script>
(function () {
  "use strict";
  var VERSION = { polished: "Polished", warm: "Warm", playful: "Playful", custom: "Your own" };
  var params = new URLSearchParams(location.search);
  var room = (String(params.get("room") || "default").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40)) || "default";
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  if (room !== "default") { $("#room-chip").textContent = "Room " + room; $("#room-chip").hidden = false; }
  var last = "";

  function render(entries) {
    var key = JSON.stringify(entries);
    if (key === last) return;
    last = key;
    $("#count").textContent = entries.length ? entries.length + (entries.length === 1 ? " site live" : " sites live") : "";
    $("#empty").hidden = entries.length > 0;
    $("#grid").innerHTML = entries.map(function (e) {
      if (!/^https:\/\//i.test(e.liveUrl)) return "";
      var ver = VERSION[e.version] ? '<span class="gal-ver ' + esc(e.version) + '">' + esc(VERSION[e.version]) + "</span>" : "";
      return '<a class="gal-card" href="' + esc(e.liveUrl) + '" target="_blank" rel="noopener">' +
        '<span class="gal-name">' + esc(e.name) + "</span>" +
        '<span class="gal-url">' + esc(e.liveUrl.replace(/^https:\/\//i, "")) + ' <svg style="width:12px;height:12px;vertical-align:-1px" aria-hidden="true"><use href="#i-ext"/></svg></span>' +
        ver + "</a>";
    }).join("");
  }

  function load() {
    return fetch("/api/gallery?room=" + encodeURIComponent(room), { cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        if (!res.body.ok) { $("#err").hidden = false; $("#err").textContent = res.body.message || "Couldn't load the gallery."; return; }
        $("#err").hidden = true;
        render(res.body.entries || []);
      })
      .catch(function () { $("#err").hidden = false; $("#err").textContent = "Couldn't reach the server."; });
  }
  load();
  setInterval(function () { if (!document.hidden) load(); }, 8000);
})();
</script>
</body>
</html>
